name: Native Product Contracts
on:
  pull_request:
    paths: ['next/**', '.github/workflows/native-contracts.yml', '.gitattributes']
  push:
    branches: [master]
    paths:
      - 'next/**'
      - '!next/docs/**'
      - '!next/**/README.md'
      - '!next/**/AGENTS.md'
      - '.github/workflows/native-contracts.yml'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    if: github.repository == 'livehtworks/wvd'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Locked Dependencies
        shell: pwsh
        run: |
          python next/tools/dependencies.py
          python next/tools/prepare_native.py
          Push-Location next/web
          npm install --global npm@11.11.0
          npm ci --ignore-scripts --no-audit --no-fund
          Pop-Location
          cmake --preset windows-x64 -S next
      - name: Affected Production Contracts
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $baseSha = switch ($env:EVENT_NAME) {
            'pull_request' { $env:PR_BASE_SHA }
            'push' { $env:PUSH_BEFORE_SHA }
            default { $null }
          }
          $validBase = $baseSha -match '^[0-9a-fA-F]{40}$' -and $baseSha -ne ('0' * 40)
          if ($validBase) {
            git cat-file -e "$baseSha^{commit}" 2>$null
            $validBase = $LASTEXITCODE -eq 0
          }
          $eolChanged = $null
          if ($validBase) {
            $eolChanged = git diff --name-only $baseSha -- .gitattributes
            $validBase = $LASTEXITCODE -eq 0
          }
          if ($validBase -and -not $eolChanged) {
            python next/tools/run_contracts.py --changed-from $baseSha --output next/.local/ci-contracts
          } else {
            python next/tools/run_contracts.py --module runtime --module devices --module recognition --module app --module tools --module web --output next/.local/ci-contracts
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-contract-evidence
          path: |
            next/.local/ci-contracts
            next/.local/logs
